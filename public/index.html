<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live session</title>

  <style>
    :root {
      --page: #f5f4f0;
      --ink: #1d1c1a;
      --muted: #6b6861;
      --line: #dddad2;
      --card: #ffffff;
      --stage: #121315;
      --stage-ink: #f2f1ed;
      --stage-muted: #a3a09a;
      --accent: #1f6f5c;
      --accent-ink: #ffffff;
      --live: #d6453d;
      --warn-bg: #fff6e0;
      --warn-ink: #6a4a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #17181a;
        --ink: #eeede9;
        --muted: #a09d96;
        --line: #303236;
        --card: #1f2023;
        --stage: #0c0d0e;
        --accent: #3fa58c;
        --accent-ink: #08110f;
        --warn-bg: #3a2f12;
        --warn-ink: #f3dfa6;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    header { margin-bottom: 20px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--line);
    }
    body[data-state="live"] .dot { background: var(--live); animation: pulse 1.8s ease-in-out infinite; }
    body[data-state="live"] .eyebrow { color: var(--live); }
    @keyframes pulse { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }

    h1 {
      margin: 6px 0 0;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    /* The box the Zoom player lives in */
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 360px;
      background: var(--stage);
      color: var(--stage-ink);
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    body[data-state="live"] .stage {
      aspect-ratio: auto;
      display: block;
      overflow: visible;
      background: transparent;
    }

    #meetingSDKElement { width: 100%; }

    .panel {
      width: min(380px, calc(100% - 40px));
      text-align: center;
    }
    body[data-state="live"] .panel { display: none; }

    .panel h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .panel p {
      margin: 0 0 18px;
      color: var(--stage-muted);
      font-size: 14.5px;
    }

    form { display: grid; gap: 10px; text-align: left; }
    label { font-size: 13px; color: var(--stage-muted); }
    input {
      width: 100%;
      margin-top: 4px;
      padding: 11px 12px;
      font: inherit;
      color: var(--stage-ink);
      background: #1d1f22;
      border: 1px solid #34373c;
      border-radius: 8px;
    }
    input:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button {
      margin-top: 4px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button[disabled] { opacity: 0.6; cursor: default; filter: none; }

    .message {
      margin: 14px 0 0;
      font-size: 14px;
      color: var(--stage-muted);
      min-height: 1.5em;
      text-align: center;
    }
    .message.problem { color: #ffb4a8; }

    .setup {
      text-align: left;
      background: var(--warn-bg);
      color: var(--warn-ink);
      border-radius: 10px;
      padding: 16px 18px;
      font-size: 14.5px;
    }
    .setup strong { display: block; margin-bottom: 4px; }
    .setup code {
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .setup ul { margin: 6px 0 0; padding-left: 20px; }

    footer {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body data-state="loading">
  <div class="wrap">
    <header>
      <span class="eyebrow"><span class="dot"></span><span id="eyebrowText">Session</span></span>
      <h1 id="pageTitle">Live session</h1>
    </header>

    <main class="stage" id="stage">
      <!-- Zoom draws the player in here once someone joins -->
      <div id="meetingSDKElement"></div>

      <!-- Shown before joining and after the session ends -->
      <div class="panel" id="panel">
        <div id="joinBox" hidden>
          <h2 id="panelHeading">Watch the session</h2>
          <p id="panelText">Enter your name and the player opens right here on the page.</p>
          <form id="joinForm" novalidate>
            <label>Your name
              <input id="nameInput" name="name" type="text" autocomplete="name" maxlength="60" required />
            </label>
            <label id="emailRow" hidden>Email
              <input id="emailInput" name="email" type="email" autocomplete="email" />
            </label>
            <button id="joinButton" type="submit">Watch session</button>
          </form>
        </div>

        <div class="setup" id="setupBox" hidden></div>

        <p class="message" id="message" role="status" aria-live="polite">Loading…</p>
      </div>
    </main>

    <footer>The session plays in your browser. No Zoom download needed.</footer>
  </div>

  <!--
    Zoom Meeting SDK (Component View), loaded from Zoom's own servers.
    To update later, change the version number in all seven lines below.
  -->
  <script src="https://source.zoom.us/6.10.0/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/6.10.0/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/6.10.0/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/6.10.0/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/6.10.0/lib/vendor/react-redux.min.js"></script>
  <script src="https://source.zoom.us/6.10.0/lib/vendor/lodash.min.js"></script>
  <script src="https://source.zoom.us/zoom-meeting-embedded-6.10.0.min.js"></script>

  <script>
    (function () {
      var body = document.body;
      var stage = document.getElementById("stage");
      var sdkElement = document.getElementById("meetingSDKElement");
      var joinBox = document.getElementById("joinBox");
      var setupBox = document.getElementById("setupBox");
      var joinForm = document.getElementById("joinForm");
      var joinButton = document.getElementById("joinButton");
      var nameInput = document.getElementById("nameInput");
      var emailRow = document.getElementById("emailRow");
      var emailInput = document.getElementById("emailInput");
      var message = document.getElementById("message");
      var eyebrowText = document.getElementById("eyebrowText");
      var panelHeading = document.getElementById("panelHeading");
      var panelText = document.getElementById("panelText");

      var session = { askEmail: false, language: "en-US" };
      var client = null;
      var clientReady = false;

      function setState(state) {
        body.dataset.state = state;
        eyebrowText.textContent = state === "live" ? "Live now" : "Session";
      }

      function say(text, isProblem) {
        message.textContent = text || "";
        message.classList.toggle("problem", !!isProblem);
      }

      // Builds the notice without innerHTML so nothing from settings is run as code.
      function showSetup(title, lines, items) {
        setupBox.textContent = "";
        var strong = document.createElement("strong");
        strong.textContent = title;
        setupBox.appendChild(strong);
        lines.forEach(function (line) {
          var div = document.createElement("div");
          div.textContent = line;
          setupBox.appendChild(div);
        });
        if (items && items.length) {
          var ul = document.createElement("ul");
          items.forEach(function (item) {
            var li = document.createElement("li");
            var code = document.createElement("code");
            code.textContent = item;
            li.appendChild(code);
            ul.appendChild(li);
          });
          setupBox.appendChild(ul);
        }
        setupBox.hidden = false;
        joinBox.hidden = true;
        say("");
        setState("setup");
      }

      /* ---- 1. Ask the Netlify function for the page title and whether setup is done ---- */

      function loadSession() {
        if (location.protocol === "file:") {
          showSetup("Open this page from your website", [
            "This page was opened directly as a file, so it cannot reach Zoom. Open it at your Netlify address instead.",
          ]);
          return;
        }

        fetch("/api/session")
          .then(function (res) {
            if (!res.ok) throw new Error("helper");
            return res.json();
          })
          .then(function (info) {
            session = info;
            document.getElementById("pageTitle").textContent = info.title;
            document.title = info.title;
            emailRow.hidden = !info.askEmail;
            emailInput.required = !!info.askEmail;

            if (info.missing && info.missing.length) {
              showSetup("Setup isn't finished yet", [
                "In Netlify, go to Project configuration > Environment variables, add the following, then trigger a new deploy:",
              ], info.missing);
              return;
            }

            if (!window.ZoomMtgEmbedded) {
              showSetup("The Zoom player could not load", [
                "The player files come from source.zoom.us. A network filter or browser extension may be blocking them. Try another network or browser.",
              ]);
              return;
            }

            joinBox.hidden = false;
            say("");
            setState("ready");
          })
          .catch(function () {
            showSetup("The page can't reach its helper", [
              "The page could not reach its Netlify function. Check that the netlify folder was uploaded to GitHub and that the latest deploy succeeded.",
            ]);
          });
      }

      /* ---- 2. Join: fetch a signature, start the Zoom player ---- */

      function startPlayer() {
        if (clientReady) return Promise.resolve();

        client = window.ZoomMtgEmbedded.createClient();

        // Make the player fill the stage instead of floating as a small window.
        var width = Math.max(320, Math.floor(stage.clientWidth));
        var height = Math.round(width * 9 / 16);

        return client.init({
          zoomAppRoot: sdkElement,
          language: session.language || "en-US",
          patchJsMedia: true,
          leaveOnPageUnload: true,
          customize: {
            video: {
              isResizable: false,
              popper: { disableDraggable: true },
              viewSizes: { default: { width: width, height: height } },
            },
          },
        }).then(function () {
          clientReady = true;
          client.on("connection-change", function (payload) {
            if (!payload) return;
            if (payload.state === "Closed") sessionEnded();
            if (payload.state === "Reconnecting") say("Reconnecting…");
          });
        });
      }

      function join(name, email) {
        joinButton.disabled = true;
        say("Connecting…");

        fetch("/api/join", { method: "POST" })
          .then(function (res) {
            return res.json().then(function (data) {
              if (!res.ok) throw { reason: data.error || "The session could not be prepared." };
              return data;
            });
          })
          .then(function (data) {
            return startPlayer().then(function () {
              return client.join({
                signature: data.signature,
                meetingNumber: data.meetingNumber,
                password: data.passcode || "",
                userName: name,
                userEmail: email || "",
              });
            });
          })
          .then(function () {
            say("");
            setState("live");
          })
          .catch(function (err) {
            console.error("Zoom join failed:", err);
            say(explain(err), true);
            setState("ready");
          })
          .then(function () {
            joinButton.disabled = false;
          });
      }

      function sessionEnded() {
        setState("ended");
        panelHeading.textContent = "The session has ended";
        panelText.textContent = "Thanks for watching. If it is still running, you can join again.";
        joinButton.textContent = "Join again";
        say("");
      }

      // Turns Zoom's error into something a viewer (or you) can act on.
      function explain(err) {
        var reason = (err && (err.reason || err.message)) || "";
        var code = err && err.errorCode ? " (code " + err.errorCode + ")" : "";
        var lower = String(reason).toLowerCase();

        if (lower.indexOf("signature") !== -1) {
          return "Zoom rejected the page's credentials" + code + ". Check ZOOM_CLIENT_ID and ZOOM_CLIENT_SECRET in Netlify, and that the meeting is hosted by the same Zoom account as the app.";
        }
        if (lower.indexOf("passcode") !== -1 || lower.indexOf("password") !== -1) {
          return "The passcode was not accepted" + code + ". Check MEETING_PASSCODE in Netlify.";
        }
        if (lower.indexOf("not started") !== -1 || lower.indexOf("not begin") !== -1) {
          return "The session has not started yet. Try again in a moment.";
        }
        if (lower.indexOf("failed to fetch") !== -1 || lower.indexOf("networkerror") !== -1 || lower.indexOf("connection error") !== -1) {
          return "Could not reach Zoom" + code + ". Check your internet connection and try again.";
        }
        return (reason ? reason : "Could not join the session") + code + ".";
      }

      joinForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var name = nameInput.value.trim();
        var email = emailInput.value.trim();
        if (!name) { say("Please enter your name.", true); nameInput.focus(); return; }
        if (session.askEmail && !/^\S+@\S+\.\S+$/.test(email)) {
          say("Please enter a valid email address.", true); emailInput.focus(); return;
        }
        join(name, email);
      });

      loadSession();
    })();
  </script>
</body>
</html>
